var T={"en":{"ttl":"Nizam","nav":["Timer","Calendar","Summary","Learn","Settings"],"s":["Spiritual","Physical","Academic","Social","Art"],"ic":["<i class=\"dot\" style=\"background:var(--c1)\"></i>","<i class=\"dot\" style=\"background:var(--c2)\"></i>","<i class=\"dot\" style=\"background:var(--c3)\"></i>","<i class=\"dot\" style=\"background:var(--c4)\"></i>","<i class=\"dot\" style=\"background:var(--c5)\"></i>"],"h":"h","m":"m","stop":"Stop","pause":"Pause","resume":"Resume","discard":"Discard","fs":"Full screen","ask":"What did you do?","ph":"Type activity…","save":"Save","skip":"Skip","cancel":"Cancel","pre":[["Reading Quran"],["Running","Workout","Stretching","Walking"],["Studying","Homework","Reading","Coding"],["Family","Friends","Volunteering","Networking"],["Drawing","Music","Crafts","Writing"]],"day":"Day","week":"Week","month":"Month","saved":"Saved","total":"Total","tap":"Tap a section to start the timer","add":"Add activity","sph":"Sphere","when":"Started at","dur":"Duration","td":"Today","wk":"This week","mo":"This month","most":"Most time","none":"Nothing logged yet","del":"Delete","lang":"Language","acct":"Account","acc1":"Your data is saved in this browser on this device.","acc2":"Your data is saved in this browser on this device.","acc3":"To move it to another device, export a file here and import it there.","data":"Data","wipe":"Delete all data","wipe2":"Tap again to delete everything","learn":[["Muhasaba: take yourself to account","“Take yourself to account before you are taken to account.” — Umar (may Allah be pleased with him)\nMuhasaba is when a person reviews their daily deeds, intentions, words and mistakes, and gives an account to themselves.\nAllah the Exalted says: “Let every soul look to what it has put forth for tomorrow.” (Surah al-Hashr, 59:18)\nThe Prophet (peace be upon him) taught that on the Day of Judgment a person will be asked how they spent their life, how they used their youth, where they earned and spent their wealth, and what they did with their knowledge (Tirmidhi). Time is one of the most important parts of this trust.\nThat is why every day we should ask ourselves:\n• What good deed did I do today?\n• What sin or mistake did I commit?\n• Did I hurt anyone’s feelings?\n• Did I use my time well?\n• What did I improve compared with yesterday?\nThe main aim: to recognise our mistakes and change ourselves for the better. This is not about guilt but awareness: to notice, to correct yourself, and to live tomorrow more intentionally.\n1. Yesterday and today\nThe well-known advice “whoever’s yesterday and today are the same is at a loss” calls a person to grow. A Muslim should try to change for the better every day.\nNizam helps with the question about time: each evening, open your Calendar and see where your day went. Nizam gives no religious rulings; it only helps you see your time."],["What is Nizam for?","Nizam helps you see where your time really goes and spend it on purpose. You start a timer for what you are doing, write what it was, and Nizam builds your day, your calendar and your balance across five spheres: spiritual, physical, academic, social and art."],["How to use Nizam","1. On the Timer tab, tap the sphere of what you are about to do. The timer starts at once.\n2. Do one thing only. If you get distracted or must stop, press Pause.\n3. When you return to your task, press Resume.\n4. When you finish, press Stop and write what you did, or tap one of the suggestions.\n5. Forgot to start the timer? Add the session later with the + button on the Calendar or Summary tab.\n6. Wrong time? Use −15, −1, +1 and +15 to adjust.\n7. Once a week, open Summary and check which sphere got the least time."],["Your daily goal","A daily goal turns good intentions into a habit. In Nizam you choose how much focused time you want to log each day, and a bar on the Timer tab shows your progress. When you reach your goal, Nizam says well done.\nFor beginners we suggest aiming for 3 hours a day of focused time tracked with Nizam, and treating 2 hours as the minimum. Prayer, exercise, study, time with family and creative work all count, so 3 hours is realistic for most people.\nIf that feels like too much, start with 1 hour and add 30 minutes each week. You can change your goal at any time in Settings."],["The 10,000-hour idea","A popular rule of thumb says that mastering a demanding skill, such as tennis, an instrument or a language, takes around 10,000 hours of practice. It was made famous by Malcolm Gladwell, based on research by psychologist Anders Ericsson.\nIt is not a magic number. Ericsson himself stressed that what counts is deliberate practice: focused, challenging work with feedback, not just hours spent near the task. Some skills take less, some much more.\nStill, the idea is useful. 10,000 hours is about 3 hours a day for roughly nine years. That is why a steady daily goal matters more than occasional heroic effort.\nPick the one skill you love, give it focused sessions in Nizam, and let the hours add up. Every honest session is a small deposit toward mastery."],["Focus and concentration","The timer works like a promise to yourself: while it runs, you do only this one thing. If you check your phone, chat or drift away, press Pause, deal with it, and press Resume only when you are really back. This way your numbers show real, focused time, not just time spent near the task.\nFocus is a habit that grows with practice. Many people find short, honest sessions work better than long, distracted ones. Use full screen mode to see only the clock."],["Tips and tricks","Start small: begin with just 10 minutes. Starting is the hardest part, and the timer makes it easy.\nOne timer, one task: if you switch tasks, stop and start a new session.\nPause honestly: phone, messages, a visitor? Press Pause. Only focused minutes should count.\nWork in blocks: 25 to 50 minutes of focus, then a short break, works well for many people.\nAnchor it to your day: link a session to something you already do, such as after prayer, after breakfast or when you arrive at the library.\nPhone away: put it face down or in another room, and use full screen mode so you see only the clock.\nName every session: writing what you did makes your calendar meaningful and your suggestions smarter.\nPlan tomorrow tonight: choose the first sphere you will start with.\nLook at the week: every Sunday check which sphere is missing and book a session for it.\nCelebrate small wins: a finished session is progress, even on a hard day.\nDo not compare: your numbers are for you. A short honest day beats a perfect plan you never follow."],["Benefits of Nizam","Focus: a running timer reminds you to stay with one task.\nAwareness: you see where your time truly goes.\nBalance: five spheres keep study, health, faith, people and creativity in view.\nMotivation: watching your sessions add up helps you stay consistent.\nHonest records: the calendar and charts show your day, week and month.\nPrivate by default: your data stays on this device. Use Export to back it up or move it."],["Why five spheres?","A person is more than a job or grades. Nizam divides your time into five areas that together describe a full life: spiritual, physical, academic, social and creative.\nEach one feeds something different: meaning, energy, knowledge, belonging and self-expression. Tracking all five shows where your time really goes, not where you think it goes."],["Balance is not equal time","Balance does not mean one hour for each sphere. Before exams you will study more; on holiday you may rest and see friends.\nWhat matters is the trend over weeks: no sphere should disappear for a long time. Open the Summary tab and look at the donut chart to see the shape of your week."],["When one sphere takes over","If you only study and drop sport, your energy, mood and focus often suffer over time. If you only train, studies and friendships can fade. If you only socialise, long-term goals can slip.\nOverloading one sphere may work for a short sprint, but it usually costs you elsewhere. A little time every day in a neglected sphere beats one big effort a month."],["What counts in each sphere","Spiritual: prayer, reading the Quran, dhikr, reflection, quiet time.\nPhysical: running, workout, stretching, walking, any sport.\nAcademic: studying, homework, reading, coding, courses.\nSocial: family, friends, volunteering, community.\nArt: drawing, music, crafts, writing, any creative hobby."],["Time is a trust","Many traditions see time as something entrusted to us. Knowing how it is spent is the first step to using it with intention, and to being grateful for it."]],"confQ":"Finish this activity?","confYes":"Yes, finish","confNo":"No, continue","confP":"Timer is paused.","goalQ":"What is your daily goal?","goalSub":"How much focused time do you want to log each day? You can change it later in Settings.","goalRec":"Recommended for beginners: 3 hours.","goalLater":"Later","goalNone":"No goal","goalLabel":"Daily goal","goalChange":"Change","goalDone":"Well done! You reached your daily goal.","goalCustom":"Custom (hours)","goalOff":"Not set","quote":"Let us take ourselves to account before we are taken to account.","quoteBy":"Umar ibn al-Khattab (r.a.)","hlT":"Highlights","spT":"Spheres","balT":"Balance","allT":"All time","mastery":"Toward 10,000 hours","last7":"Last 7 days","setG":"Set a daily goal","streak":"{n}-day streak","hlUp":"This week: {a} logged, {d} more than last week.","hlDn":"This week: {a} logged, {d} less than last week.","hlNew":"This week: {a} logged so far.","hlLow":"Least time this week: {s}. A short session can restore balance.","hlBest":"Best day this week: {d}, {a}.","hlGoal":"Daily goal reached on {n} of the last 7 days.","searchPh":"Search activities…","since":"Since {d}","sessions":"Sessions","daysP":"Days practiced","avg":"Average session","longest":"Longest session","last30":"Last 30 days","lastP":"Last practiced","closeB":"Close","noActs":"Name your sessions and they will appear here, with total time and start date.","cvC":"Calendar","cvT":"Table","cvK":"Checklist","mtot":"Month totals","colAct":"Activity","colTot":"Total","colSince":"Since","byMonth":"By month","allB":"All","startQ":"Start this activity?","startYes":"Yes, start","startNo":"No","exit":"Exit","spheresT":"Spheres","spHint":"Switch off the fifth sphere if it doesn't fit your life. Past entries stay saved.","on":"On","off":"Off","pfT":"Your profile","pfEdit":"Edit","obT":"Welcome","obSub":"A few quick questions to tailor the app to you. All optional.","obLang":"Language","obAge":"Age","obGen":"Gender","obM":"Male","obF":"Female","obN":"Prefer not to say","obCo":"Where are you using this site from?","obCoPh":"Country or city","obOcc":"Do you study or work?","obSt":"Study","obWk":"Work","obBo":"Both","obNo":"Neither","obWhy":"What will you use the app for?","obW":["Faith & worship","Study","Work","Health & sport","Family & friends","Balance in life"],"obGo":"Continue","obSk":"Skip for now"},"ru":{"ttl":"Низам","nav":["Таймер","Календарь","Сводка","Знания","Настройки"],"s":["Духовное","Физическое","Академическое","Социальное","Искусство"],"ic":["<i class=\"dot\" style=\"background:var(--c1)\"></i>","<i class=\"dot\" style=\"background:var(--c2)\"></i>","<i class=\"dot\" style=\"background:var(--c3)\"></i>","<i class=\"dot\" style=\"background:var(--c4)\"></i>","<i class=\"dot\" style=\"background:var(--c5)\"></i>"],"h":"ч","m":"м","stop":"Стоп","pause":"Пауза","resume":"Продолжить","discard":"Сбросить","fs":"На весь экран","ask":"Что именно вы делали?","ph":"Напишите занятие…","save":"Сохранить","skip":"Пропустить","cancel":"Отмена","pre":[["Чтение Корана"],["Бег","Воркаут","Растяжка","Прогулка"],["Учёба","Домашка","Чтение","Программирование"],["Семья","Друзья","Волонтёрство","Нетворкинг"],["Рисование","Музыка","Рукоделие","Письмо"]],"day":"День","week":"Неделя","month":"Месяц","saved":"Сохранено","total":"Всего","tap":"Нажмите секцию, чтобы запустить таймер","add":"Добавить занятие","sph":"Сфера","when":"Начало","dur":"Длительность","td":"Сегодня","wk":"Неделя","mo":"Месяц","most":"Больше всего времени","none":"Пока ничего не записано","del":"Удалить","lang":"Язык","acct":"Аккаунт","acc1":"Данные хранятся в этом браузере на этом устройстве.","acc2":"Данные хранятся в этом браузере на этом устройстве.","acc3":"Чтобы перенести их на другое устройство, сделайте экспорт здесь и импорт там.","data":"Данные","wipe":"Удалить все данные","wipe2":"Нажмите ещё раз, чтобы удалить всё","learn":[["Мухасаба: призови себя к ответу","«Призови себя к ответу, прежде чем тебя призовут к ответу» — Умар (да будет доволен им Аллах)\nМухасаба — это когда человек анализирует свои ежедневные дела, намерения, слова и ошибки и отчитывается перед самим собой.\nВсевышний Аллах говорит: «Пусть каждая душа посмотрит, что она приготовила для завтрашнего дня». (сура «аль-Хашр», 59:18)\nПророк (мир ему и благословение Аллаха) сообщил, что в Судный день человека спросят о том, на что он потратил жизнь, как использовал молодость, откуда получил и на что истратил имущество и как поступал со своим знанием (ат-Тирмизи). Время — одна из важнейших частей этого доверенного нам.\nПоэтому каждый день мы должны задавать себе вопросы:\n• Какое доброе дело я совершил(а) сегодня?\n• Какой грех или ошибку я допустил(а)?\n• Не обидел(а) ли я кого-то?\n• Правильно ли я использовал(а) своё время?\n• Что я улучшил(а) по сравнению со вчерашним днём?\nГлавная цель: осознать свои ошибки и измениться к лучшему. Это не чувство вины, а осознанность: заметить, исправиться и прожить завтрашний день внимательнее.\n1. Вчерашний и сегодняшний день\nИзвестное наставление «Тот, чей вчерашний день равен сегодняшнему, в убытке» призывает человека к развитию. Мусульманин должен стремиться становиться лучше каждый день.\nНизам помогает с вопросом о времени: каждый вечер открывайте «Календарь» и смотрите, куда ушёл ваш день. Низам не выносит религиозных решений, он лишь помогает увидеть своё время."],["Для чего Низам?","Низам помогает увидеть, куда на самом деле уходит ваше время, и тратить его осознанно. Вы запускаете таймер на то, чем занимаетесь, записываете, что это было, а Низам собирает ваш день, календарь и баланс по пяти сферам: духовной, физической, учебной, социальной и творческой."],["Как пользоваться Низамом","1. На вкладке «Таймер» нажмите сферу того, что собираетесь делать. Таймер запустится сразу.\n2. Занимайтесь чем-то одним. Если отвлеклись или нужно прерваться, нажмите «Пауза».\n3. Когда вернулись к делу, нажмите «Продолжить».\n4. Закончив, нажмите «Стоп» и напишите, что делали, или выберите подсказку.\n5. Забыли включить таймер? Добавьте занятие позже кнопкой + на вкладке «Календарь» или «Сводка».\n6. Время указано неверно? Поправьте кнопками −15, −1, +1 и +15.\n7. Раз в неделю заглядывайте в «Сводку» и смотрите, какой сфере досталось меньше всего времени."],["Ваша дневная цель","Дневная цель превращает намерения в привычку. В Низаме вы выбираете, сколько сосредоточенного времени хотите записывать каждый день, а полоса на вкладке «Таймер» показывает прогресс. Когда вы достигнете цели, Низам скажет: «Отлично!»\nНачинающим мы советуем ставить цель 3 часа в день сосредоточенного времени по системе Низам, а 2 часа считать минимумом. Намаз, спорт, учёба, время с семьёй и творчество засчитываются, поэтому 3 часа реальны для большинства людей.\nЕсли это слишком много, начните с 1 часа и добавляйте по 30 минут в неделю. Цель можно менять в любой момент в Настройках."],["Идея 10 000 часов","Распространённое правило гласит: чтобы овладеть сложным навыком, будь то теннис, музыкальный инструмент или язык, нужно около 10 000 часов практики. Его прославил Малкольм Гладуэлл, опираясь на исследования психолога Андерса Эрикссона.\nЭто не магическое число. Сам Эрикссон подчёркивал, что важна целенаправленная практика: сосредоточенная, непростая работа с обратной связью, а не просто часы рядом с делом. Одним навыкам нужно меньше, другим гораздо больше.\nТем не менее идея полезна. 10 000 часов — это примерно 3 часа в день в течение девяти лет. Поэтому ровная ежедневная цель важнее редких героических рывков.\nВыберите один навык, который любите, давайте ему сосредоточенные занятия в Низаме и позвольте часам накапливаться. Каждое честное занятие — маленький вклад в мастерство."],["Фокус и концентрация","Таймер — это обещание самому себе: пока он идёт, вы делаете только одно дело. Если вы проверяете телефон, переписываетесь или отвлеклись, нажмите «Пауза», решите вопрос и нажмите «Продолжить», только когда по-настоящему вернулись. Тогда ваши цифры покажут реальное сосредоточенное время, а не просто время рядом с делом.\nФокус — привычка, которая растёт с практикой. Многим короткие честные подходы дают больше, чем долгие, но рассеянные. Включите полноэкранный режим, чтобы на экране остались только часы."],["Советы и приёмы","Начните с малого: хотя бы с 10 минут. Начать — самое трудное, а таймер делает это лёгким.\nОдин таймер — одно дело: если вы переключились на другое, остановите сессию и запустите новую.\nЧестная пауза: телефон, сообщения, гость? Нажмите «Пауза». Должны считаться только сосредоточенные минуты.\nРаботайте блоками: 25–50 минут фокуса и короткий перерыв подходят многим.\nПривяжите к распорядку дня: свяжите занятие с тем, что вы уже делаете: после намаза, после завтрака, по приходе в библиотеку.\nТелефон подальше: положите экраном вниз или в другую комнату и включите полноэкранный режим, чтобы видеть только часы.\nНазывайте каждое занятие: записанное дело делает календарь осмысленным, а подсказки умнее.\nПланируйте завтра вечером: выберите, с какой сферы начнёте.\nСмотрите на неделю: каждое воскресенье проверяйте, какой сферы не хватает, и запланируйте для неё занятие.\nПразднуйте маленькие победы: завершённое занятие уже прогресс, даже в тяжёлый день.\nНе сравнивайте себя: цифры нужны вам. Короткий честный день лучше идеального плана, которому вы не следуете."],["Какую пользу даёт приложение","Фокус: идущий таймер напоминает держаться одного дела.\nОсознанность: вы видите, куда на самом деле уходит время.\nБаланс: пять сфер держат в поле зрения учёбу, здоровье, веру, людей и творчество.\nМотивация: когда занятия складываются в цифры, легче быть последовательным.\nЧестная отчётность: календарь и диаграммы показывают день, неделю и месяц.\nПриватно: данные хранятся только на этом устройстве. Через «Экспорт» можно сделать копию или перенести их."],["Почему пять сфер?","Человек — это больше, чем работа или оценки. Низам делит ваше время на пять областей, которые вместе описывают полную жизнь: духовную, физическую, учебную, социальную и творческую.\nКаждая питает своё: смысл, энергию, знания, чувство принадлежности и самовыражение. Учёт всех пяти показывает, куда время уходит на самом деле, а не куда, как вам кажется."],["Баланс — это не поровну","Баланс не значит по часу на каждую сферу. Перед экзаменами вы больше учитесь, в отпуске больше отдыхаете и видитесь с друзьями.\nВажна динамика за недели: ни одна сфера не должна надолго пропадать. Откройте вкладку «Сводка» и посмотрите на круговую диаграмму: она показывает форму вашей недели."],["Когда одна сфера забирает всё","Если вы только учитесь и забросили спорт, со временем часто страдают энергия, настроение и концентрация. Если только тренируетесь, могут отойти на второй план учёба и друзья. Если только общаетесь, долгосрочные цели могут сдвинуться.\nПерегруз одной сферы может сработать в коротком рывке, но обычно за это платишь в другом месте. Немного времени каждый день в забытой сфере лучше, чем один большой подход в месяц."],["Что входит в каждую сферу","Духовное: намаз, чтение Корана, зикр, размышления, тишина.\nФизическое: бег, воркаут, растяжка, прогулки, любой спорт.\nАкадемическое: учёба, домашние задания, чтение, программирование, курсы.\nСоциальное: семья, друзья, волонтёрство, общество.\nИскусство: рисование, музыка, рукоделие, письмо, любое творческое хобби."],["Время — это доверенное нам","Во многих традициях время считается тем, что нам доверено. Знать, на что оно уходит, — первый шаг к тому, чтобы тратить его осознанно и быть за него благодарным."]],"confQ":"Завершить это занятие?","confYes":"Да, завершить","confNo":"Нет, продолжить","confP":"Таймер на паузе.","goalQ":"Какая у вас дневная цель?","goalSub":"Сколько сосредоточенного времени вы хотите записывать каждый день? Это можно изменить позже в Настройках.","goalRec":"Для начинающих рекомендуем: 3 часа.","goalLater":"Позже","goalNone":"Без цели","goalLabel":"Дневная цель","goalChange":"Изменить","goalDone":"Отлично! Вы достигли дневной цели.","goalCustom":"Своя (часы)","goalOff":"Не задана","quote":"Давайте призовём себя к ответу прежде, чем нас призовут к ответу.","quoteBy":"Умар ибн аль-Хаттаб (р.а.)","hlT":"Главное","spT":"Сферы","balT":"Баланс","allT":"За всё время","mastery":"К 10 000 часов","last7":"7 дней","setG":"Задать дневную цель","streak":"Серия: {n} дн.","hlUp":"На этой неделе: {a}, на {d} больше, чем на прошлой.","hlDn":"На этой неделе: {a}, на {d} меньше, чем на прошлой.","hlNew":"На этой неделе записано {a}.","hlLow":"Меньше всего времени на этой неделе: {s}. Короткое занятие вернёт баланс.","hlBest":"Лучший день недели: {d}, {a}.","hlGoal":"Дневная цель достигнута в {n} из последних 7 дней.","searchPh":"Поиск занятий…","since":"С {d}","sessions":"Занятий","daysP":"Дней практики","avg":"Среднее занятие","longest":"Самое долгое","last30":"Последние 30 дней","lastP":"Последний раз","closeB":"Закрыть","noActs":"Называйте свои занятия, и они появятся здесь: с общим временем и датой начала.","cvC":"Календарь","cvT":"Таблица","cvK":"Чек-лист","mtot":"Итоги месяца","colAct":"Занятие","colTot":"Всего","colSince":"С","byMonth":"По месяцам","allB":"Все","startQ":"Начать это занятие?","startYes":"Да, начать","startNo":"Нет","exit":"Выйти","spheresT":"Сферы","spHint":"Отключите пятую сферу, если она вам не подходит. Прошлые записи сохранятся.","on":"Вкл","off":"Выкл","pfT":"Ваш профиль","pfEdit":"Изменить","obT":"Добро пожаловать","obSub":"Несколько быстрых вопросов, чтобы настроить приложение под вас. Всё необязательно.","obLang":"Язык","obAge":"Возраст","obGen":"Пол","obM":"Мужской","obF":"Женский","obN":"Не указывать","obCo":"Откуда вы заходите на этот сайт?","obCoPh":"Страна или город","obOcc":"Вы учитесь или работаете?","obSt":"Учусь","obWk":"Работаю","obBo":"И то и другое","obNo":"Ни то ни другое","obWhy":"Для чего вам приложение?","obW":["Вера и поклонение","Учёба","Работа","Здоровье и спорт","Семья и друзья","Баланс в жизни"],"obGo":"Продолжить","obSk":"Пропустить"},"tr":{"ttl":"Nizam","nav":["Zamanlayıcı","Takvim","Özet","Bilgi","Ayarlar"],"s":["Manevi","Fiziksel","Akademik","Sosyal","Sanat"],"ic":["<i class=\"dot\" style=\"background:var(--c1)\"></i>","<i class=\"dot\" style=\"background:var(--c2)\"></i>","<i class=\"dot\" style=\"background:var(--c3)\"></i>","<i class=\"dot\" style=\"background:var(--c4)\"></i>","<i class=\"dot\" style=\"background:var(--c5)\"></i>"],"h":"sa","m":"dk","stop":"Durdur","pause":"Duraklat","resume":"Devam","discard":"Vazgeç","fs":"Tam ekran","ask":"Ne yaptınız?","ph":"Etkinliği yazın…","save":"Kaydet","skip":"Atla","cancel":"İptal","pre":[["Kur’an okuma"],["Koşu","Antrenman","Esneme","Yürüyüş"],["Ders çalışma","Ödev","Okuma","Kodlama"],["Aile","Arkadaşlar","Gönüllülük","Ağ kurma"],["Çizim","Müzik","El işi","Yazı"]],"day":"Gün","week":"Hafta","month":"Ay","saved":"Kaydedildi","total":"Toplam","tap":"Zamanlayıcıyı başlatmak için bir alana dokunun","add":"Etkinlik ekle","sph":"Alan","when":"Başlangıç","dur":"Süre","td":"Bugün","wk":"Bu hafta","mo":"Bu ay","most":"En çok zaman","none":"Henüz kayıt yok","del":"Sil","lang":"Dil","acct":"Hesap","acc1":"Verileriniz bu cihazdaki tarayıcıda saklanır.","acc2":"Verileriniz bu cihazdaki tarayıcıda saklanır.","acc3":"Başka bir cihaza taşımak için burada dışa aktarın, orada içe aktarın.","data":"Veriler","wipe":"Tüm verileri sil","wipe2":"Her şeyi silmek için tekrar dokunun","learn":[["Muhâsebe: kendini hesaba çek","“Hesaba çekilmeden önce kendini hesaba çek.” — Hz. Ömer (r.a.)\nMuhâsebe, insanın günlük işlerini, niyetini, sözlerini ve hatalarını gözden geçirip kendine hesap vermesidir.\nYüce Allah şöyle buyurur: “Herkes yarın için ne hazırladığına baksın.” (Haşr suresi, 59/18)\nPeygamber Efendimizin (s.a.s.) bildirdiğine göre kul, kıyamet gününde ömrünü nerede tükettiğinden, gençliğini nerede yıprattığından, malını nereden kazanıp nereye harcadığından ve ilmiyle ne kadar amel ettiğinden sorulacaktır (Tirmizî). Zaman, bize emanet edilen bu hesabın en önemli parçalarından biridir.\nBu yüzden her gün kendimize şunları sormalıyız:\n• Bugün hangi güzel ameli yaptım?\n• Hangi günahı ya da hatayı işledim?\n• Birinin gönlünü kırdım mı?\n• Vaktimi doğru kullandım mı?\n• Dünkü hâlime göre neyi geliştirdim?\nAsıl amaç: hatalarımızı fark edip kendimizi daha iyiye doğru değiştirmektir. Bu suçluluk duymak değil, farkında olmaktır: fark etmek, düzeltmek ve yarını daha bilinçli yaşamak.\n1. Dün ve bugün\n“Dünü ile bugünü aynı olan ziyandadır” nasihati insanı gelişmeye çağırır. Müslüman her gün daha iyiye doğru değişmeye çalışmalıdır.\nNizam, zamanla ilgili soruya yardımcı olur: her akşam Takvim’e bakıp gününün nereye gittiğini gör. Nizam dini bir hüküm vermez; yalnızca vaktini görmene yardım eder."],["Nizam ne işe yarar?","Nizam, zamanınızın gerçekte nereye gittiğini görmenize ve onu bilinçli harcamanıza yardımcı olur. Yaptığınız iş için zamanlayıcıyı başlatır, ne yaptığınızı yazarsınız; Nizam da gününüzü, takviminizi ve beş alandaki dengenizi oluşturur: manevi, fiziksel, akademik, sosyal ve sanat."],["Nizam nasıl kullanılır","1. Zamanlayıcı sekmesinde yapacağınız işin alanına dokunun. Zamanlayıcı hemen başlar.\n2. Tek bir şeyle ilgilenin. Dikkatiniz dağılırsa ya da ara vermeniz gerekirse Duraklat’a basın.\n3. İşinize döndüğünüzde Devam’a basın.\n4. Bitirince Durdur’a basın ve ne yaptığınızı yazın ya da önerilerden birine dokunun.\n5. Zamanlayıcıyı başlatmayı mı unuttunuz? Takvim veya Özet sekmesindeki + düğmesiyle oturumu sonradan ekleyin.\n6. Süre yanlışsa −15, −1, +1 ve +15 ile düzeltin.\n7. Haftada bir Özet sekmesine bakın ve hangi alanın en az zaman aldığını kontrol edin."],["Günlük hedefiniz","Günlük hedef, iyi niyetleri alışkanlığa dönüştürür. Nizam’da her gün ne kadar odaklı zaman kaydetmek istediğinizi seçersiniz; Zamanlayıcı sekmesindeki çubuk ilerlemenizi gösterir. Hedefinize ulaştığınızda Nizam size “Aferin!” der.\nYeni başlayanlar için Nizam ile günde 3 saat odaklı zaman hedeflemenizi, 2 saati ise asgari kabul etmenizi öneririz. Namaz, spor, ders, aileyle geçirilen zaman ve yaratıcı işler de sayılır; bu yüzden 3 saat çoğu insan için gerçekçidir.\nBu çok gelirse 1 saatle başlayın ve her hafta 30 dakika ekleyin. Hedefinizi istediğiniz zaman Ayarlar’dan değiştirebilirsiniz."],["10.000 saat fikri","Yaygın bir kurala göre tenis, bir enstrüman ya da bir dil gibi zor bir beceride ustalaşmak yaklaşık 10.000 saatlik pratik gerektirir. Bu fikri Malcolm Gladwell, psikolog Anders Ericsson’ın araştırmalarına dayanarak meşhur etmiştir.\nBu sihirli bir rakam değildir. Ericsson’ın kendisi, önemli olanın bilinçli pratik olduğunu vurgulamıştır: geri bildirimle yapılan, odaklı ve zorlayıcı çalışma; işin yanında geçen saatler değil. Bazı beceriler daha az, bazıları çok daha fazla zaman ister.\nYine de fikir faydalıdır. 10.000 saat, günde yaklaşık 3 saatle dokuz yıl eder. Bu yüzden ara sıra yapılan büyük gayretten çok, istikrarlı bir günlük hedef önemlidir.\nSevdiğin tek bir beceriyi seç, Nizam’da ona odaklı oturumlar ayır ve saatlerin birikmesine izin ver. Her dürüst oturum, ustalığa doğru yatırılan küçük bir birikimdir."],["Odak ve konsantrasyon","Zamanlayıcı kendinize verdiğiniz bir söz gibidir: çalıştığı sürece yalnızca bu tek işi yaparsınız. Telefona bakar, sohbet eder ya da dalıp giderseniz Duraklat’a basın, işinizi halledin ve gerçekten döndüğünüzde Devam’a basın. Böylece rakamlarınız işin yanında geçen süreyi değil, gerçek ve odaklı süreyi gösterir.\nOdak, pratikle gelişen bir alışkanlıktır. Birçok kişi için kısa ve dürüst oturumlar, uzun ama dağınık oturumlardan daha verimlidir. Ekranda yalnızca saati görmek için tam ekran modunu kullanın."],["İpuçları ve püf noktaları","Küçük başlayın: sadece 10 dakikayla başlayın. Başlamak en zor kısımdır, zamanlayıcı bunu kolaylaştırır.\nBir zamanlayıcı, bir iş: işi değiştirirseniz oturumu durdurun ve yenisini başlatın.\nDürüstçe duraklatın: telefon, mesaj, misafir mi? Duraklat’a basın. Yalnızca odaklı dakikalar sayılmalı.\nBloklar halinde çalışın: 25–50 dakika odak, ardından kısa mola birçok kişiye iyi gelir.\nGününüze bağlayın: oturumu zaten yaptığınız bir şeye bağlayın: namazdan sonra, kahvaltıdan sonra ya da kütüphaneye vardığınızda.\nTelefon uzakta: ekranı aşağı bakacak şekilde bırakın ya da başka odaya koyun, yalnızca saati görmek için tam ekran modunu kullanın.\nHer oturumu adlandırın: ne yaptığınızı yazmak takviminizi anlamlı, önerileri akıllı yapar.\nYarını bu akşam planlayın: hangi alanla başlayacağınızı seçin.\nHaftaya bakın: her pazar eksik alanı kontrol edin ve ona bir oturum ayırın.\nKüçük başarıları kutlayın: biten bir oturum, zor bir günde bile ilerlemedir.\nKıyaslamayın: rakamlar sizin için. Kısa ve dürüst bir gün, hiç uymadığınız mükemmel bir plandan iyidir."],["Nizam’ın faydaları","Odak: çalışan zamanlayıcı, tek işe bağlı kalmanızı hatırlatır.\nFarkındalık: zamanınızın gerçekte nereye gittiğini görürsünüz.\nDenge: beş alan; ders, sağlık, inanç, insanlar ve yaratıcılığı gözünüzün önünde tutar.\nMotivasyon: oturumların birikip rakamlara dönüştüğünü görmek istikrarı destekler.\nDürüst kayıt: takvim ve grafikler gününüzü, haftanızı ve ayınızı gösterir.\nGizli: verileriniz yalnızca bu cihazda kalır. Yedeklemek veya taşımak için Dışa aktar'ı kullanın."],["Neden beş alan?","İnsan, işinden ya da notlarından ibaret değildir. Nizam zamanınızı, birlikte dolu bir hayatı anlatan beş alana böler: manevi, fiziksel, akademik, sosyal ve yaratıcı.\nHer biri farklı bir ihtiyacı besler: anlam, enerji, bilgi, aidiyet ve kendini ifade. Beşini de takip etmek, zamanınızın sandığınız yere değil gerçekte nereye gittiğini gösterir."],["Denge, eşit süre demek değildir","Denge, her alana birer saat ayırmak demek değildir. Sınavlardan önce daha çok ders çalışırsınız; tatilde dinlenir ve arkadaşlarınızla görüşürsünüz.\nAsıl önemli olan haftalar boyunca gidişattır: hiçbir alan uzun süre kaybolmamalıdır. Özet sekmesindeki dairesel grafiğe bakarak haftanızın şeklini görebilirsiniz."],["Bir alan her şeyi aldığında","Yalnızca ders çalışıp sporu bırakırsanız, zamanla enerjiniz, ruh haliniz ve odaklanmanız çoğu zaman zarar görür. Yalnızca antrenman yaparsanız, dersleriniz ve arkadaşlıklarınız geri planda kalabilir. Yalnızca sosyalleşirseniz, uzun vadeli hedefler aksayabilir.\nBir alanı aşırı yüklemek kısa bir gayret için işe yarayabilir, ama genellikle başka bir yerde bedeli ödenir. İhmal edilen alana her gün biraz zaman ayırmak, ayda bir büyük çabadan iyidir."],["Her alana neler girer","Manevi: namaz, Kur’an okuma, zikir, tefekkür, sessiz zaman.\nFiziksel: koşu, antrenman, esneme, yürüyüş, her türlü spor.\nAkademik: ders çalışma, ödev, okuma, kodlama, kurslar.\nSosyal: aile, arkadaşlar, gönüllülük, toplum.\nSanat: çizim, müzik, el işi, yazı, her türlü yaratıcı hobi."],["Zaman bir emanettir","Birçok gelenek zamanı bize emanet edilmiş bir şey olarak görür. Nereye harcandığını bilmek, onu bilinçle kullanmanın ve şükretmenin ilk adımıdır."]],"confQ":"Bu etkinliği bitirmek istiyor musunuz?","confYes":"Evet, bitir","confNo":"Hayır, devam et","confP":"Zamanlayıcı duraklatıldı.","goalQ":"Günlük hedefiniz nedir?","goalSub":"Her gün ne kadar odaklı zaman kaydetmek istiyorsunuz? Bunu daha sonra Ayarlar’dan değiştirebilirsiniz.","goalRec":"Yeni başlayanlara önerilen: 3 saat.","goalLater":"Sonra","goalNone":"Hedef yok","goalLabel":"Günlük hedef","goalChange":"Değiştir","goalDone":"Aferin! Günlük hedefinize ulaştınız.","goalCust ам","nav":["Таймер","Календарь","Жыйынтык","Билим","Жөндөөлөр"],"s":["Руханий","Физикалык","Академиялык","Социалдык","Өнөр"],"ic":["<i class=\"dot\" style=\"background:var(--c1)\"></i>","<i class=\"dot\" style=\"background:var(--c2)\"></i>","<i class=\"dot\" style=\"background:var(--c3)\"></i>","<i class=\"dot\" style=\"background:var(--c4)\"></i>","<i class=\"dot\" style=\"background:var(--c5)\"></i>"],"h":"с","m":"мүн","stop":"Токтотуу","pause":"Пауза","resume":"Улантуу","discard":"Жокко чыгаруу","fs":"Толук экран","ask":"Эмне кылдыңыз?","ph":"Иш-аракетти жазыңыз…","save":"Сактоо","skip":"Өткөрүп жиберүү","cancel":"Баш тартуу","pre":[["Куран окуу"],["Чуркоо","Машыгуу","Чоюлуу","Сейилдөө"],["Сабак окуу","Үй тапшырма","Китеп окуу","Программалоо"],["Үй-бүлө","Достор","Ыктыярчылык","Таанышуу"],["Сүрөт тартуу","Музыка","Колдон жасоо","Жазуу"]],"day":"Күн","week":"Апта","month":"Ай","saved":"Сакталды","total":"Бардыгы","tap":"Таймерди баштоо үчүн бөлүмдү басыңыз","add":"Иш-аракет кошуу","sph":"Бөлүм","when":"Башталышы","dur":"Узактыгы","td":"Бүгүн","wk":"Бул апта","mo":"Бул ай","most":"Эң көп убакыт","none":"Азырынча жазуу жок","del":"Өчүрүү","lang":"Тил","acct":"Аккаунт","acc1":"Маалыматыңыз ушул түзмөктөгү браузерде сакталат.","acc2":"Маалыматыңыз ушул түзмөктөгү браузерде сакталат.","acc3":"Башка түзмөккө өткөрүү үчүн бул жерден экспорттоп, тигинде импорттоңуз.","data":"Маалымат","wipe":"Бардык маалыматты өчүрүү","wipe2":"Баарын өчүрүү үчүн дагы бир жолу басыңыз","learn":[["Мухасаба: өзүңдү суракка тарт","«Суракка тартыла электе, өзүңдү суракка тарт» — Умар (р.а.)\nМухасаба — адамдын күнүмдүк иштерин, ниетин, сөздөрүн жана каталарын анализ кылып, өзүнө эсеп берүүсү.\nАллах Таала айтат: «Ар бир жан эртеңки күн үчүн эмне даярдаганына көңүл бурсун». («Аль-Хашр» сүрөсү, 59:18)\nПайгамбарыбыз (с.а.в.) кабарлаганындай, Кыямат күнү пенде өмүрүн эмнеге короткону, жаштыгын кантип колдонгону, байлыгын кайдан тапып кайда сарптаганы жана билимине канчалык амал кылганы жөнүндө сурак берет (ат-Тирмизи). Убакыт — бизге аманат берилген ушул эсептин эң маанилүү бөлүктөрүнүн бири.\nОшондуктан күн сайын өзүбүзгө суроо беришибиз керек:\n• Бүгүн кандай жакшы амал кылдым?\n• Кандай күнөө же ката кетирдим?\n• Бирөөнүн көңүлүн ооруткан жокмунбу?\n• Убактымды туура пайдаландымбы?\n• Кечээгиге салыштырмалуу эмнемди жакшырттым?\nНегизги максат: каталарыбызды таанып, өзүбүздү жакшы жакка өзгөртүү. Бул күнөөлүү сезүү эмес, аң-сезимдүү болуу: байкоо, оңдонуу жана эртеңки күндү көбүрөөк ой менен жашоо.\n1. Кечээки күн жана бүгүнкү күн\n«Кечээги күнү менен бүгүнкү күнү бирдей болгон адам зыянда» деген насаат адамды өнүгүүгө чакырат. Мусулман күн сайын жакшы жакка өзгөрүүгө аракет кылышы керек.\nНизам убакыт жөнүндөгү суроого жардам берет: ар кечте «Календарды» ачып, күнүңүз кайда кеткенин караңыз. Низам диний өкүм чыгарбайт, ал убактыңызды көрүүгө гана жардам берет."],["Низам эмне үчүн?","Низам убактыңыз чындыгында кайда кетип жатканын көрүүгө жана аны аң-сезимдүү короого жардам берет. Сиз иш баштаарда таймерди иштетип, эмне кылганыңызды жазасыз, ал эми Низам күнүңүздү, календарыңызды жана беш бөлүм боюнча тең салмактуулугуңузду түзөт: руханий, физикалык, академиялык, социалдык жана өнөр."],["Низамды кантип колдонуу керек","1. «Таймер» өтмөгүндө кыла турган ишиңиздин бөлүмүн басыңыз. Таймер дароо башталат.\n2. Бир гана иш менен алектениңиз. Көңүлүңүз бөлүнсө же токтоого туура келсе, «Пауза» баскычын басыңыз.\n3. Ишиңизге кайтканда «Улантуу» баскычын басыңыз.\n4. Бүткөндө «Токтотуу» баскычын басып, эмне кылганыңызды жазыңыз же сунуштардын бирин тандаңыз.\n5. Таймерди иштетүүнү унуттуңузбу? Сессияны кийинчерээк «Календарь» же «Жыйынтык» өтмөгүндөгү + баскычы менен кошуңуз.\n6. Убакыт туура эмеспи? −15, −1, +1 жана +15 баскычтары менен оңдоңуз.\n7. Аптасына бир жолу «Жыйынтыкты» ачып, кайсы бөлүмгө эң аз убакыт бөлүнгөнүн текшериңиз."],["Күнүмдүк максатыңыз","Күнүмдүк максат жакшы ниетти адатка айландырат. Низамда сиз күн сайын канча көңүл топтолгон убакыт жазгыңыз келгенин тандайсыз, ал эми «Таймер» өтмөгүндөгү тилке прогрессиңизди көрсөтөт. Максатыңызга жеткенде Низам «Азаматсыз!» дейт.\nЖаңы баштагандарга Низам боюнча күнүнө 3 саат көңүл топтолгон убакытты максат кылууну, ал эми 2 саатты минимум деп эсептөөнү сунуштайбыз. Намаз, спорт, окуу, үй-бүлө менен өткөргөн убакыт жана чыгармачылык да эсепке кирет, ошондуктан 3 саат көпчүлүк адам үчүн реалдуу.\nЭгер бул өтө көп сезилсе, 1 сааттан баштап, ар апта сайын 30 мүнөттөн кошуңуз. Максатты каалаган убакта «Жөндөөлөрдөн» өзгөртө аласыз."],["10 000 саат идеясы","Кеңири таралган эреже боюнча, теннис, музыкалык аспап же тил сыяктуу татаал көндүмдү өздөштүрүү үчүн болжол менен 10 000 саат машыгуу керек. Аны Малкольм Гладуэлл психолог Андерс Эрикссондун изилдөөлөрүнө таянып белгилүү кылган.\nБул сыйкырдуу сан эмес. Эрикссондун өзү маанилүүсү максаттуу машыгуу экенин баса белгилеген: көңүл топтоп, кыйынчылык менен, кайтарым байланыш менен иштөө, ишке жакын өткөн сааттар эмес. Айрым көндүмдөргө азыраак, айрымдарына болсо бир топ көп убакыт керек.\nАнткен менен идея пайдалуу. 10 000 саат — күнүнө болжол менен 3 сааттан тогуз жыл. Ошондуктан сейрек жасалган зор аракеттен көрө туруктуу күнүмдүк максат маанилүү.\nСиз сүйгөн бир көндүмдү тандап, Низамда ага көңүл топтолгон сессияларды бөлүп, сааттардын топтолушуна жол бериңиз. Ар бир чынчыл сессия — чеберчиликке карай салынган кичинекей салым."],["Көңүл топтоо жана концентрация","Таймер — өзүңүзгө берген убада сыяктуу: ал иштеп турганда бир гана ишти аткарасыз. Телефонго карап, баарлашып же көңүлүңүз сыртка чыкса, «Пауза» басып, маселени чечип, чындап кайтканыңызда гана «Улантуу» басыңыз. Ошондо цифралар ишке жакын өткөн убакытты эмес, чыныгы көңүл топтолгон убакытты көрсөтөт.\nКөңүл топтоо — көнүгүү менен өнүгүүчү адат. Көптөгөн адамдарга кыска жана чынчыл сессиялар узун, бирок чачыранды сессиялардан натыйжалуураак. Экранда саат гана калышы үчүн толук экран режимин колдонуңуз."],["Кеңештер жана амалдар","Кичинеден баштаңыз: жок дегенде 10 мүнөттөн. Баштоо — эң кыйыны, таймер аны жеңилдетет.\nБир таймер — бир иш: башка ишке өтсөңүз, сессияны токтотуп, жаңысын баштаңыз.\nЧынчыл пауза: телефон, билдирүү, коноктор барбы? «Пауза» басыңыз. Эсепке көңүл топтолгон мүнөттөр гана кириши керек.\nБлок менен иштеңиз: 25–50 мүнөт көңүл топтоп, кыска тыныгуу көптөгөн адамдарга жакшы жардам берет.\nКүнүңүзгө байлаңыз: сессияны сиз мурунтан эле кылган нерсеге байлаңыз: намаздан кийин, эртең мененки тамактан кийин, китепканага келгенде.\nТелефонду алыс коюңуз: экранын ылдый каратып же башка бөлмөгө коюп, саатты гана көрүү үчүн толук экран режимин колдонуңуз.\nАр сессияга ат бериңиз: эмне кылганыңызды жазуу календарыңызды маанилүү, сунуштарды акылдуу кылат.\nЭртеңди бүгүн кечинде пландаңыз: кайсы бөлүмдөн баштаарыңызды тандаңыз.\nАптага көз салыңыз: ар жекшембиде кайсы бөлүм жетишпей жатканын текшерип, ага сессия пландаңыз.\nКичине жеңиштерди белгилеңиз: бүткөн сессия оор күндө да прогресс.\nСалыштырбаңыз: цифралар сиз үчүн. Кыска, бирок чынчыл күн, эч качан аткарылбай турган мыкты пландан жакшы."],["Низамдын пайдасы","Көңүл топтоо: иштеп турган таймер бир ишке байланып турууну эскертет.\nАң-сезимдүүлүк: убакыт чындыгында кайда кетип жатканын көрөсүз.\nТең салмактуулук: беш бөлүм окууну, ден соолукту, ишенимди, адамдарды жана чыгармачылыкты көз алдыңызда кармайт.\nДем берүү: сессиялардын цифраларга чогулганын көрүү туруктуулукка жардам берет.\nЧынчыл отчёт: календарь жана диаграммалар күндү, аптаны жана айды көрсөтөт.\nКупуя: маалыматыңыз ушул түзмөктө гана сакталат. Көчүрмө алуу же башка түзмөккө өткөрүү үчүн «Экспорт» колдонуңуз."],["Эмне үчүн беш бөлүм?","Адам иштен же баалардан гана турбайт. Низам убактыңызды толук жашоону сүрөттөгөн беш чөйрөгө бөлөт: руханий, физикалык, академиялык, социалдык жана чыгармачыл.\nАлардын ар бири өзүнчө муктаждыкты тойгузат: маани, күч-кубат, билим, таандыктык жана өзүн көрсөтүү. Бешөөнү тең эсептөө убактыңыз ойлогон жерге эмес, чындыгында кайда кетип жатканын көрсөтөт."],["Тең салмактуулук — бирдей убакыт дегенди билдирбейт","Тең салмактуулук ар бир бөлүмгө бир саттан бөлүү дегенди билдирбейт. Экзамендин алдында көбүрөөк окуйсуз, эс алууда көбүрөөк эс алып, достор менен жолугасыз.\nМаанилүүсү — апталар боюнча багыт: бир дагы бөлүм узак убакытка жоголбошу керек. «Жыйынтык» өтмөгүндөгү тегерек диаграммага карап, аптаңыздын формасын көрүңүз."],["Бир бөлүм баарын алып койгондо","Эгер окуп гана жүрүп спортту таштасаңыз, убакыттын өтүшү менен күч-кубат, маанай жана көңүл топтоо көп учурда начарлайт. Тыным албай машыксаңыз, окуу жана достук экинчи планга өтүшү мүмкүн. Тынымсыз баарлашсаңыз, узак мөөнөттүү максаттар артта калышы ыктымал.\nБир бөлүмдү ашыкча жүктөө кыска аралыкка жардам бериши мүмкүн, бирок адатта башка жерден төлөнөт. Унутулган бөлүмгө күн сайын бир аз убакыт бөлүү айына бир жолу чоң аракет кылгандан жакшы."],["Ар бир бөлүмгө эмнелер кирет","Руханий: намаз, Куран окуу, зикир, ой жүгүртүү, тынчтык.\nФизикалык: чуркоо, машыгуу, чоюлуу, сейилдөө, ар кандай спорт.\nАкадемиялык: сабак окуу, үй тапшырма, китеп окуу, программалоо, курстар.\nСоциалдык: үй-бүлө, достор, ыктыярчылык, коом.\nӨнөр: сүрөт тартуу, музыка, колдон жасоо, жазуу, ар кандай чыгармачыл хобби."],["Убакыт — аманат","Көптөгөн салттарда убакыт бизге аманат катары берилген нерсе деп эсептелет. Анын кайда сарпталганын билүү — аны аң-сезимдүү колдонуунун жана ыраазы болуунун биринчи кадамы."]],"confQ":"Бул иш-аракетти аяктайсызбы?","confYes":"Ооба, аяктоо","confNo":"Жок, улантуу","confP":"Таймер паузада.","goalQ":"Күнүмдүк максатыңыз кандай?","goalSub":"Күн сайын канча көңүл топтолгон убакыт жазгыңыз келет? Муну кийинчерээк Жөндөөлөрдөн өзгөртө аласыз.","goalRec":"Жаңы баштагандарга сунуш: 3 саат.","goalLater":"Кийинчерээк","goalNone":"Максатсыз","goalLabel":"Күнүмдүк максат","goalChange":"Өзгөртүү","goalDone":"Азаматсыз! Күнүмдүк максатыңызга жеттиңиз.","goalCustom":"Өз варианты (саат)","goalOff":"Коюлган эмес","quote":"Суракка тартыла электе, өзүңдү суракка тарт.","quot
