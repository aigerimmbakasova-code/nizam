<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Nizam · Статистика</title>
<link rel="icon" href="icons/favicon-32-v5.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f1f2ee;--card:#fbfbf9;--fg:#18231f;--mut:#667169;--bd:rgba(24,35,31,.11);--fill:rgba(24,35,31,.06);--ac:#2a5d68;--c1:#4f8a7b;--c2:#b97d4c;--c3:#4f77a3;--c4:#8b6fa8;--c5:#a98a2c;--serif:"Literata",Georgia,serif;--sans:"Manrope",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101513;--card:#171e1b;--fg:#e9eeea;--mut:#8f9b94;--bd:rgba(233,238,234,.12);--fill:rgba(233,238,234,.07);--ac:#8cc0ca;--c1:#7fb8a6;--c2:#d9a173;--c3:#86abd0;--c4:#b69bd0;--c5:#d6b65a}}
:root[data-theme="dark"]{--bg:#101513;--card:#171e1b;--fg:#e9eeea;--mut:#8f9b94;--bd:rgba(233,238,234,.12);--fill:rgba(233,238,234,.07);--ac:#8cc0ca}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);font-variant-numeric:tabular-nums}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font:500 1.7rem var(--serif);margin:0}
.mut{color:var(--mut);font-size:.85rem}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;background:var(--fill);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:42px}
.pri{background:var(--ac);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.k b{display:block;font:500 1.9rem/1.1 var(--serif);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.card h2{font:600 1rem var(--sans);margin:0 0 12px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:.9rem}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:10px;border-radius:5px;background:var(--ac);min-width:2px}
.bar em{font-style:normal;text-align:right;font-weight:700}
.days{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:6px}
.days i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px;position:relative}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:600}
.wrap{overflow-x:auto}
.center{text-align:center;padding:60px 16px}
.gbtn{background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:999px;min-height:48px;padding:10px 22px}
</style>
</head>
<body>
<main>
<header><div><h1>Статистика Nizam</h1><div class="mut" id="upd"></div></div><div style="display:flex;gap:8px"><button id="ref">⟳ Обновить</button><a class="btn" href="./">← В приложение</a></div></header>
<div id="app"><p class="mut center">Загрузка…</p></div>
</main>
<script src="vendor/supabase-2.118.0.js"></script>
<script>
var SB=null;try{SB=supabase.createClient("https://egvwkwdggkpbhvadqwqu.supabase.co","sb_publishable_VV_MwjZJ_ZixJmpZg-8SQg_tzpVtu4J",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}})}catch(e){}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
var LAB={gender:{m:"Мужской",f:"Женский",n:"Не указан"},occupation:{s:"Учится",w:"Работает",b:"И то и другое",n:"Ни то ни другое"},purposes:["Вера и поклонение","Учёба","Работа","Здоровье и спорт","Семья и друзья","Баланс в жизни"],langs:{en:"English",ru:"Русский",tr:"Türkçe",ky:"Кыргызча"},spheres:["Духовное","Физическое","Академическое","Социальное","Искусство"]};
var RN=null;try{RN=new Intl.DisplayNames(["ru"],{type:"region"})}catch(e){}
function country(c){if(!c)return "—";if(c==="KG")return "Кыргызстан";try{return RN?RN.of(c):c}catch(e){return c}}
function dt(s){if(!s)return "—";var d=new Date(s);return d.toLocaleDateString("ru",{day:"numeric",month:"short",year:"numeric"})}
function bars(title,arr,lab,unit){if(!arr||!arr.length)return '<div class="card"><h2>'+title+'</h2><p class="mut">Пока нет данных</p></div>';var mx=Math.max.apply(null,arr.map(function(x){return x.n}))||1;
return '<div class="card"><h2>'+title+'</h2>'+arr.map(function(x){return '<div class="bar"><span>'+esc(lab(x.k))+'</span><i style="width:'+(x.n/mx*100)+'%"></i><em>'+x.n+(unit||"")+'</em></div>'}).join("")+'</div>'}
function kpi(l,v){return '<div class="k"><span class="mut">'+l+'</span><b>'+(v==null?"—":v)+'</b></div>'}
function signin(){SB.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:"select_account"}}})}
async function load(){var app=$("app");if(!SB){app.innerHTML='<p class="center mut">Нет соединения.</p>';return}
var s=(await SB.auth.getSession()).data.session;
if(!s){app.innerHTML='<div class="center"><p>Войдите аккаунтом администратора.</p><button class="gbtn" id="gin">Войти через Google</button></div>';$("gin").onclick=signin;return}
var a=await SB.rpc("is_admin");if(a.error||!a.data){app.innerHTML='<p class="center">Нет доступа для '+esc(s.user.email)+'.</p>';return}
app.innerHTML='<p class="mut center">Загрузка…</p>';
var r=await SB.rpc("admin_stats");if(r.error){app.innerHTML='<p class="center">Ошибка: '+esc(r.error.message)+'</p>';return}var d=r.data;
var days=[],sm={};(d.signups||[]).forEach(function(x){sm[x.d]=x.n});for(var i=29;i>=0;i--){var t=new Date(Date.now()-i*864e5),k=t.toISOString().slice(0,10);days.push({k:k,n:sm[k]||0})}var dm=Math.max.apply(null,days.map(function(x){return x.n}))||1;
app.innerHTML='<div class="kpis">'+kpi("Пользователей",d.users)+kpi("Новых сегодня",d.new_today)+kpi("Новых за 7 дней",d.new_7d)+kpi("Новых за 30 дней",d.new_30d)+kpi("Активны за день",d.active_1d)+kpi("Активны за 7 дней",d.active_7d)+kpi("Активны за 30 дней",d.active_30d)+kpi("Средний возраст",d.avg_age)+kpi("Всего часов",d.hours)+kpi("Всего сессий",d.sessions)+'</div>'
+'<div class="card" style="margin-bottom:12px"><h2>Регистрации за 30 дней</h2><div class="days">'+days.map(function(x){return '<i title="'+x.k+': '+x.n+'" style="height:'+(x.n/dm*100)+'%"></i>'}).join("")+'</div><div class="mut" style="display:flex;justify-content:space-between;margin-top:4px"><span>'+dt(days[0].k)+'</span><span>'+dt(days[29].k)+'</span></div></div>'
+'<div class="grid">'+bars("Откуда заходят",d.countries,country)+bars("Возраст",d.ages,function(k){return k})+bars("Пол",d.gender,function(k){return LAB.gender[k]||k})+bars("Учёба / работа",d.occupation,function(k){return LAB.occupation[k]||k})+bars("Цели",d.purposes,function(k){return LAB.purposes[k]||k})+bars("Язык приложения",d.langs,function(k){return LAB.langs[k]||k})+bars("Часы по сферам",d.spheres,function(k){return LAB.spheres[k]||k}," ч")+'</div>'
+'<div class="card" style="margin-top:12px"><h2>Последние регистрации</h2><div class="wrap"><table><tr><th>Имя</th><th>Откуда</th><th>Регистрация</th><th>Последний визит</th></tr>'+(d.recent||[]).map(function(u){return '<tr><td>'+esc(((u.first_name||"")+" "+(u.last_name||"")).trim()||"—")+'</td><td>'+esc(country(u.country))+'</td><td>'+dt(u.created_at)+'</td><td>'+dt(u.last_seen)+'</td></tr>'}).join("")+'</table></div></div>';
$("upd").textContent="Обновлено: "+new Date().toLocaleString("ru")}
$("ref").onclick=load;
if(SB)SB.auth.onAuthStateChange(function(ev){if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN")load()});else load();
</script>
</body>
</html>
